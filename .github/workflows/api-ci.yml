name: API checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:73bedc9eaa0121b92b9b26bb52e5141b3f6f37479c7ef913c0160455763ca80a
        env:
          POSTGRES_USER: altvia_test
          POSTGRES_DB: altvia_test
          POSTGRES_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U altvia_test -d altvia_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALTVIA_DATABASE_URL: postgresql+psycopg://altvia_test:test-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/altvia_test
      ALTVIA_PUBLIC_ORIGIN: https://testserver
      ALTVIA_ALLOW_TEST_DB: "1"
      ALTVIA_REDIS_URL: redis://:test-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:6379/0
      ALTVIA_CI_REDIS_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: sh scripts/ci_redis.sh
      - run: uv run ruff check apps/api
      - run: uv run ruff format --check apps/api
      - run: uv run mypy
      - run: uv run alembic -c apps/api/alembic.ini upgrade head
      - run: uv run alembic -c apps/api/alembic.ini check
      - run: uv run pytest -q
      - run: uv build
      - if: always()
        run: docker rm -f altvia-ci-redis

# This job validates API development. It does not homologate the target CPU,
# scan production images or replace the Phase 1/6 deployment/security gates.
