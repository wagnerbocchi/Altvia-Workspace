name: Container checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ALTVIA_ALLOW_CONTAINER_TEST: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check scripts
      - run: uv run ruff format --check scripts
      - run: shellcheck -s sh infra/start-ingress.sh infra/start-postgres.sh infra/postgres-runtime-marker.sh infra/redis-health.sh infra/start-redis.sh scripts/ci_redis.sh
      - run: pnpm --filter @altvia/web exec playwright install --with-deps chromium
      - run: uv run python scripts/container_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-browser-${{ github.sha }}
          path: .superpowers/container-tests/*/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

# Real Docker/Linux image, HTTPS and recovery proof; not target-VM homologation.
# Smoke cleanup stops only its random task project and never deletes volumes.
