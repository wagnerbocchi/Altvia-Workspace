Foreground yes
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
Bytecode yes
BytecodeSecurity TrustSigned
FailIfCvdOlderThan 2
AlertEncrypted yes
AlertExceedsMax yes
ConcurrentDatabaseReload no
SelfCheck 10
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 20M
MaxScanTime 10000
MaxRecursion 8
MaxThreads 2
MaxQueue 4
ReadTimeout 5
CommandReadTimeout 5
SendBufTimeout 500
LogTime no
LogClean no
LogVerbose no
LogFile /dev/stderr
LogFileUnlock yes
LogFileMaxSize 0
