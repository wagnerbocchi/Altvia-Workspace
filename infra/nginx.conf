pid /tmp/nginx.pid;
error_log /dev/stderr crit;
worker_processes auto;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver @RESOLVERS@ valid=5s ipv6=off;
    upstream altvia_api {
        zone altvia_api 64k;
        server api:8080 resolve;
    }
    upstream altvia_web {
        zone altvia_web 64k;
        server web:3000 resolve;
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        # One forwarding boundary for API and pages; client-supplied trust headers
        # never become the web server's external origin or authenticated source.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Only the concrete binary upload collections have a larger body budget.
        # Streaming lets the API reject current auth before consuming the body.
        location ~ ^/api/v1/(tickets|work-items)/[^/]+/attachments$ {
            client_max_body_size 10m;
            client_body_timeout 60s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 65s;
            proxy_pass http://altvia_api;
        }
        location /api/v1/ {
            proxy_pass http://altvia_api;
        }
        location / { proxy_pass http://altvia_web; }
    }
}
