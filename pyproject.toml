[project]
name = "altvia-workspace"
version = "0.1.0"
description = "Internal Altvia workspace API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "pydantic-settings>=2.7,<3",
  "dramatiq[redis]==2.2.1",
  "redis==8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "httpx2>=2.16.0",
    "bandit==1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/altvia"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["apps/api/altvia"]
